   <text style="font: 9px 'DejaVu Sans'; text-anchor: start" x="22.68" y="317.52" transform="rotate(-0 22.68 317.52)">Two fresh Windows repetitions give identical counts. One synthetic package, two layouts; no model repair experiment.</text>
